<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학 앱 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#a8d8f0; --blue-d:#4a90b8; --blue-l:#e3f3fb;
  --pink:#f7c5d5; --pink-d:#c45c84; --pink-l:#fdebf1;
  --yel:#fbe7a1;  --yel-d:#a8841e;  --yel-l:#fef8e1;
  --grn:#c0ed70;  --grn-d:#4d6b16;  --grn-l:#f0f8df;
  --ink:#3d4660; --mut:#7f88a3; --bg:#fbfaff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans KR',sans-serif;background:var(--bg);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:280px;height:280px;background:var(--blue);top:-90px;left:-80px}
.b2{width:240px;height:240px;background:var(--pink);top:180px;right:-110px}
.b3{width:260px;height:260px;background:var(--yel);bottom:-100px;left:10%}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 18px calc(env(safe-area-inset-bottom) + 32px)}
header{text-align:center;margin-bottom:26px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--blue)}.dots i:nth-child(2){background:var(--pink)}.dots i:nth-child(3){background:var(--yel)}
h1{font-family:'Jua',sans-serif;font-weight:400;font-size:38px;margin:0;letter-spacing:1px}
h1 span:nth-child(1){color:var(--blue-d)}h1 span:nth-child(2){color:var(--pink-d)}h1 span:nth-child(3){color:var(--yel-d)}
.sub{color:var(--mut);margin:8px 0 0;font-size:14px}
.group{margin-top:22px}
.group h2{display:inline-block;font-family:'Jua',sans-serif;font-weight:400;font-size:16px;margin:0 0 10px;padding:4px 14px;border-radius:999px;background:var(--tone-l);color:var(--tone-d);border:1.5px solid var(--tone)}
a.app{display:block;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--tone);border-radius:22px;padding:18px 20px 18px 22px;margin-bottom:14px;position:relative;overflow:hidden;
  box-shadow:0 6px 0 var(--tone), 0 10px 24px rgba(61,70,96,.08);transition:transform .12s, box-shadow .12s}
a.app::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--tone-l)}
a.app:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tone), 0 4px 12px rgba(61,70,96,.08)}
a.app b{position:relative;z-index:1;display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:23px;color:var(--tone-d);margin-bottom:4px}
a.app span{position:relative;z-index:1;color:var(--mut);font-size:13px;line-height:1.55}
a.app em{position:relative;z-index:1;display:inline-block;margin-top:10px;font-style:normal;font-size:12px;font-weight:700;color:var(--tone-d);background:var(--tone-l);padding:5px 12px;border-radius:999px}
.t-blue{--tone:var(--blue);--tone-d:var(--blue-d);--tone-l:var(--blue-l)}
.t-pink{--tone:var(--pink);--tone-d:var(--pink-d);--tone-l:var(--pink-l)}
.t-yel{--tone:var(--yel);--tone-d:var(--yel-d);--tone-l:var(--yel-l)}
footer{margin-top:32px;color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <header>
    <div class="dots"><i></i><i></i><i></i></div>
    <h1><span>과학</span> <span>앱</span> <span>모음</span></h1>
    <p class="sub">수업 시간에 쓰는 과학 시뮬레이션과 게임</p>
  </header>
  <div id="list"></div>
  <footer>과목별로 앱이 계속 추가될 예정이에요.</footer>
</main>
<script>
// 새 앱을 추가할 때는 이 목록에 한 줄만 넣으면 됩니다.
// tone: 'blue' | 'pink' | 'yel' 중 하나 (비워 두면 과목 색을 따라가요)
const APPS = [
  { subject: '물리', title: '찌릿찌릿 전자기 연구소', desc: '솔레노이드 · 전동기 · 발전기 시뮬레이션과 방향 맞히기 게임', path: 'electromagnetic-induction/' },
  { subject: '지구과학', title: '별의 핵', desc: '수소에서 철까지, 원형 중력 속에서 원소를 융합하는 핵합성 게임', path: 'stellar-nucleosynthesis/' },
];
const SUBJECTS = [
  { name: '물리', tone: 'blue' },
  { name: '화학', tone: 'pink' },
  { name: '생명과학', tone: 'grn' },
  { name: '지구과학', tone: 'yel' },
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('list').innerHTML = SUBJECTS
  .filter(sub => APPS.some(a => a.subject === sub.name))
  .map(sub => `<section class="group t-${sub.tone}"><h2>${sub.name}</h2>` +
    APPS.filter(a => a.subject === sub.name).map(a =>
      `<a class="app t-${a.tone || sub.tone}" href="${a.path}"><b>${esc(a.title)}</b><span>${esc(a.desc)}</span><br><em>시작하기</em></a>`).join('') +
    `</section>`).join('');
</script>
</body>
</html>
